<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Astro Miner</title>
  <link rel="manifest" href="/astro-miner-idle/public/manifest.json" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root {
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      background: #0f0f1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <script>
    // Инициализация Telegram Mini App
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    window.Telegram.WebApp.disableVerticalSwipes();
    
    // Адаптация под тему Telegram
    const tg = window.Telegram.WebApp;
    document.documentElement.style.setProperty('--tg-bg', tg.backgroundColor || '#0f0f1a');
    document.documentElement.style.setProperty('--tg-text', tg.textColor || '#ffffff');
    document.documentElement.style.setProperty('--tg-hint', tg.hintColor || '#aaaaaa');
    document.documentElement.style.setProperty('--tg-link', tg.linkColor || '#4ea4f6');
    document.documentElement.style.setProperty('--tg-button', tg.buttonColor || '#2ea043');
    document.documentElement.style.setProperty('--tg-button-text', tg.buttonTextColor || '#ffffff');
    
    // Безопасная зона для iPhone с чёлкой
    document.documentElement.style.setProperty('--safe-top', 'env(safe-area-inset-top, 0px)');
    document.documentElement.style.setProperty('--safe-bottom', 'env(safe-area-inset-bottom, 0px)');
  </script>
  
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
